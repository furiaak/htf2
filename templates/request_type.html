{% extends "base.html" %}

{% block header_subtitle %}
<div class="subtitle">Pilih jenis transfer</div>
{% endblock %}

{% block content %}
<div class="container">
    <h2 style="margin-bottom: 20px; font-size: 20px; font-weight: 600; color: #3E5A3A;">Buat Permintaan</h2>

    <div class="option-card" onclick="location.href='{{ url_for('create_request', type='incoming') }}'">
        <div class="option-icon">📥</div>
        <div class="option-title">Transfer dari orang lain ke saya</div>
        <div class="option-desc">Saya butuh stok dari gudang lain / toko</div>
    </div>
    
    <div class="option-card" onclick="location.href='{{ url_for('create_request', type='outgoing') }}'">
        <div class="option-icon">📤</div>
        <div class="option-title">Transfer dari saya ke orang lain</div>
        <div class="option-desc">Saya ingin mengirim stok ke gudang lain / toko</div>
    </div>
</div>

<!-- Minimal local style for option cards (sage green palette) -->
<style>
.option-card {
    background: white;
    border-radius: 20px;
    padding: 24px 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    border: 1px solid #E6EDE6;
}

.option-card:active {
    background: #F7FAF5;
    transform: scale(0.98);
    border-color: #7C9F6E;
}

.option-icon {
    font-size: 48px;
    margin-bottom: 12px;
}

.option-title {
    font-size: 18px;
    font-weight: 600;
    color: #2E3B2B;
    margin-bottom: 8px;
}

.option-desc {
    font-size: 13px;
    color: #6B7F6B;
}
</style>
{% endblock %}
